name: Bitcoin key hunt

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests base58 coincurve
      - run: python hunt.py
      - name: Gem resultat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain wallets.csv)" ]; then
            git add wallets.csv
            git commit -m "hunt: nye fund [skip ci]"
            git push
          fi
